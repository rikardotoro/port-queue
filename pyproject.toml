[project]
name = "port-queue"
version = "0.1.0"
description = "The typhoon closed the port for two days. The queue lasted more than a week."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13.7", "pandas>=2.2", "numpy>=1.26", "simpy>=4.1"]

[project.scripts]
port-queue = "port_queue.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/port_queue"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
